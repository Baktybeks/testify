openapi: 3.0.3
info:
  title: Testify Supabase API
  version: 1.0.0
  description: Authenticated RPC API. See API.md for administrative command payloads and error mappings.
servers:
  - url: https://YOUR_PROJECT.supabase.co
security:
  - bearerAuth: []
    apiKey: []
paths:
  /rest/v1/rpc/my_profile:
    post:
      operationId: myProfile
      responses:
        "200":
          description: Active profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [student, teacher, superadmin] }
                  full_name: { type: string }
                  active: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/student_modules:
    post:
      operationId: studentModules
      responses:
        "200":
          description: Assigned modules and existing attempts
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/attempt_start_or_resume:
    post:
      operationId: startOrResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_module_id]
              properties:
                p_module_id: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Current" }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/attempt_current:
    post:
      operationId: currentAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_attempt_id]
              properties:
                p_attempt_id: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Current" }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/attempt_submit_answer:
    post:
      operationId: submitAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_attempt_id, p_position, p_option_id, p_key]
              properties:
                p_attempt_id: { type: string, format: uuid }
                p_position: { type: integer, minimum: 1 }
                p_option_id: { type: string, format: uuid }
                p_key: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Current" }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/admin_data:
    post:
      operationId: adminData
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p_module_id: { type: string, format: uuid, nullable: true }
                p_group_id: { type: string, nullable: true }
      responses:
        "200":
          {
            description: Teacher dashboard with modules/groups/students/attempts/stats,
          }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/admin_questions:
    post:
      operationId: adminQuestions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [p_module_id]
              properties:
                p_module_id: { type: string, format: uuid }
      responses:
        "200": { description: Teacher-only question bank }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/admin_open_exam_groups:
    post:
      operationId: adminOpenExamGroups
      description: Teacher-only, atomically sets the exact group access list and opens a ready draft or closed exam. Existing time windows are preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_module_id, p_group_ids]
              properties:
                p_module_id: { type: string, format: uuid }
                p_group_ids:
                  { type: array, minItems: 1, items: { type: string } }
      responses:
        "200": { description: Opened for the selected group IDs }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/admin_command:
    post:
      operationId: adminCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_action, p_data]
              properties:
                p_action:
                  type: string
                  enum:
                    [
                      save_module,
                      copy_module,
                      transition,
                      save_group,
                      delete_group,
                      group_access,
                      student_status,
                      rename_student,
                      save_questions,
                      delete_question,
                      save_subject,
                      save_course_module,
                    ]
                p_data: { type: object, additionalProperties: true }
      responses:
        "200": { description: Command committed; ok=true }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/admin_attempt_action:
    post:
      operationId: adminAttemptAction
      description: Role-gated, audited and idempotent retake/deletion/publication operation. Deletion requires superadmin and the student's exact login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_action, p_module_id, p_student_id, p_reason, p_key]
              properties:
                p_action:
                  {
                    type: string,
                    enum:
                      [
                        grant_retake,
                        revoke_retake,
                        delete_attempt,
                        publish_result,
                      ],
                  }
                p_module_id: { type: string, format: uuid }
                p_student_id: { type: string }
                p_reason: { type: string, minLength: 3, maxLength: 1000 }
                p_key: { type: string, format: uuid }
                p_attempt_id: { type: string, format: uuid, nullable: true }
                p_start_deadline:
                  { type: string, format: date-time, nullable: true }
                p_confirmation: { type: string, nullable: true }
                p_grant_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          {
            description: Committed,
            or the previous response for the same request key,
          }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/admin_delete_unused_exam:
    post:
      operationId: adminDeleteUnusedExam
      description: Teacher-only removal of a draft without attempts, counters or retake grants. Deletes its questions and group access. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_module_id, p_confirmation]
              properties:
                p_module_id: { type: string, format: uuid }
                p_confirmation: { type: string, description: Exact exam title }
      responses:
        "200": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /rest/v1/rpc/superadmin_teachers:
    post:
      operationId: superadminTeachers
      description: Superadmin-only list of staff profiles and Auth email addresses. No passwords returned.
      responses:
        "200": { description: Staff array with id, full_name, email, role, active, created_at }
        default: { $ref: "#/components/responses/Error" }
  /functions/v1/manage-account:
    post:
      operationId: manageAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              oneOf:
                - properties:
                    action: { enum: [create] }
                - required: [id]
                  properties:
                    action: { enum: [reset] }
                - required: [full_name, email, password]
                  properties:
                    action: { enum: [create-teacher] }
              properties:
                action: { type: string, enum: [create, reset, create-teacher] }
                email: { type: string, format: email }
                id: { type: string }
                login: { type: string }
                full_name: { type: string }
                group_id: { type: string }
                active: { type: boolean }
                password:
                  {
                    type: string,
                    minLength: 8,
                    maxLength: 128,
                    writeOnly: true,
                  }
      responses:
        "200":
          description: Student code shown once; create-teacher is superadmin-only and returns the new teacher id without password.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  code: { type: string }
        default:
          description: Edge error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKey: { type: apiKey, in: header, name: apikey }
  responses:
    Error:
      description: PostgREST error (400/401/403/409/429/5xx, depending on operation)
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              details: { type: string, nullable: true }
              hint: { type: string, nullable: true }
    Current:
      description: Current server-authoritative attempt; no answer keys
      content:
        application/json:
          schema:
            type: object
            required:
              [attempt_id, done, title, total, server_now, attempt_deadline]
            properties:
              attempt_id: { type: string, format: uuid }
              done: { type: boolean }
              annulled: { type: boolean }
              void_reason: { type: string }
              attempt_number: { type: integer, minimum: 1 }
              title: { type: string }
              subject_name: { type: string }
              course_module_title: { type: string }
              index: { type: integer, minimum: 1 }
              total: { type: integer }
              question: { type: string }
              options:
                type: array
                items:
                  type: object
                  required: [id, text]
                  properties:
                    id: { type: string, format: uuid }
                    text: { type: string }
              server_now: { type: string, format: date-time }
              question_deadline: { type: string, format: date-time }
              attempt_deadline: { type: string, format: date-time }
              outcome: { type: string, enum: [accepted, expired_or_stale] }
              published: { type: boolean }
              score: { type: number }
              correct: { type: integer }
              max_score: { type: number }
